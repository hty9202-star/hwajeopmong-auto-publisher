name = "hwajeopmong-auto-publisher"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# Cron Triggers: 매일 09:00, 11:00, 13:00, 15:00, 17:00 KST (= 00:00, 02:00, 04:00, 06:00, 08:00 UTC)
[triggers]
crons = ["0 0 * * *", "0 2 * * *", "0 4 * * *", "0 6 * * *", "0 8 * * *"]

# KV Namespace (발행 이력, 토픽 로테이션 저장)
[[kv_namespaces]]
binding = "HWJ_KV"
id = "YOUR_KV_NAMESPACE_ID"

# Environment Variables (Cloudflare Dashboard에서 설정)
# OPENAI_API_KEY = "sk-..."                    ← OpenAI API 키 (필수)
# WP_ACCESS_TOKEN = "..."                      ← WordPress.com OAuth 토큰 (14일마다 갱신)
# WP_SITE_ID = "mongclinictest.wordpress.com"  ← WordPress.com 사이트 (기본값 설정됨)
# PEXELS_API_KEY = "..."                       ← 선택사항 (이미지용)
