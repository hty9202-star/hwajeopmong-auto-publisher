<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO Auto-Publisher | 관리자 로그인</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-wrap {
  width: 100%;
  max-width: 380px;
  padding: 20px;
}
.login-header {
  text-align: center;
  margin-bottom: 28px;
}
.login-logo {
  width: 56px;
  height: 56px;
  margin: 0 auto 14px;
}
.login-title {
  color: #111827;
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 4px;
}
.login-sub {
  color: #9ca3af;
  font-size: 13px;
}
.login-card {
  background: #fff;
  border-radius: 12px;
  padding: 28px 24px;
  border: 1px solid #e5e7eb;
}
.form-group {
  margin-bottom: 18px;
}
.form-group:last-of-type {
  margin-bottom: 24px;
}
.form-label {
  display: block;
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 6px;
  font-weight: 500;
}
.form-input-wrap {
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color 0.2s;
}
.form-input-wrap:focus-within {
  border-color: #E3002B;
}
.form-input-wrap svg {
  flex-shrink: 0;
}
.form-input {
  flex: 1;
  border: none;
  background: transparent;
  padding: 10px 0;
  font-size: 14px;
  color: #374151;
  outline: none;
}
.form-input::placeholder {
  color: #c0c0c0;
}
.login-btn {
  width: 100%;
  padding: 11px;
  background: #E3002B;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}
.login-btn:hover {
  background: #c50025;
}
.login-btn:disabled {
  background: #ccc;
  cursor: not-allowed;
}
.error-msg {
  margin-top: 14px;
  text-align: center;
  font-size: 13px;
  color: #ef4444;
  min-height: 20px;
}
.login-footer {
  text-align: center;
  margin-top: 20px;
}
.login-footer p {
  font-size: 11px;
  color: #9ca3af;
}
</style>
</head>

    <div class="login-title">GEO Auto-Publisher</div>
    <div class="login-sub">관리자 콘솔</div>
  </div>

  <div class="login-card">
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">아이디</label>
        <div class="form-input-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" class="form-input" id="adminId" placeholder="아이디를 입력하세요" autocomplete="username" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <div class="form-input-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" class="form-input" id="adminPw" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
        </div>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">로그인</button>
    </form>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="login-footer">
    <p>화접몽 한의원 GEO 콘텐츠 자동 발행 시스템</p>
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  var id = document.getElementById('adminId').value.trim();
  var pw = document.getElementById('adminPw').value;
  var btn = document.getElementById('loginBtn');
  var errEl = document.getElementById('errorMsg');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '로그인 중...';

  fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id, password: pw })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) {
      sessionStorage.setItem('adminToken', data.token);
      window.location.href = '/dashboard';
    } else {
      errEl.textContent = data.error || '아이디 또는 비밀번호가 일치하지 않습니다';
      btn.disabled = false;
      btn.textContent = '로그인';
    }
  })
  .catch(function() {
    errEl.textContent = '서버 연결에 실패했습니다';
    btn.disabled = false;
    btn.textContent = '로그인';
  });
}
</script>
