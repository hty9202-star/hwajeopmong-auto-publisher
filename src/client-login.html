<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화접몽 콘텐츠 관리 - 로그인</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f7f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    margin: 20px;
  }
  .logo-area {
    text-align: center;
    margin-bottom: 36px;
  }
  .logo-icon {
    width: 56px;
    height: 56px;
    background: #2D5A27;
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .logo-icon svg { width: 32px; height: 32px; }
  .logo-area h1 {
    font-size: 22px;
    color: #1a1a1a;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .logo-area p {
    color: #888;
    font-size: 14px;
    margin-top: 6px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    transition: border-color 0.2s;
    outline: none;
    background: #fafafa;
  }
  .form-group input:focus {
    border-color: #2D5A27;
    background: #fff;
  }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: #2D5A27;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }
  .login-btn:hover { background: #224a1e; }
  .login-btn:active { background: #1b3c18; }
  .login-btn:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
  .error-msg {
    background: #fef2f2;
    color: #b91c1c;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    border: 1px solid #fecaca;
  }
</style>
</head>
<body>

<div class="login-container">
  <div class="logo-area">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
        <path d="M8 12c0-2 1-4 4-4s4 2 4 4-1 4-4 4"/>
      </svg>
    </div>
    <h1>화접몽 콘텐츠 관리</h1>
    <p>광고주 전용 로그인</p>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="userId">아이디</label>
      <input type="text" id="userId" placeholder="아이디를 입력하세요" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="userPw">비밀번호</label>
      <input type="password" id="userPw" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
    </div>
    <button type="submit" class="login-btn" id="loginBtn">로그인</button>
  </form>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const id = document.getElementById('userId').value.trim();
  const password = document.getElementById('userPw').value;
  const errorMsg = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');

  errorMsg.style.display = 'none';
  loginBtn.disabled = true;
  loginBtn.textContent = '로그인 중...';

  try {
    const res = await fetch('/api/client/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, password })
    });

    const data = await res.json();

    if (res.ok && data.token) {
      sessionStorage.setItem('token', data.token);
      if (data.clientName) sessionStorage.setItem('clientName', data.clientName);
      window.location.href = '/client';
    } else {
      errorMsg.textContent = data.error || data.message || '아이디 또는 비밀번호가 올바르지 않습니다.';
      errorMsg.style.display = 'block';
    }
  } catch (err) {
    errorMsg.textContent = '서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.';
    errorMsg.style.display = 'block';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = '로그인';
  }
}
</script>

</body>
</html>
