<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화접몽 콘텐츠 관리</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f7f5;
    min-height: 100vh;
    color: #1a1a1a;
  }

  /* Header */
  .header {
    background: #fff;
    border-bottom: 1px solid #e5e7e5;
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-logo {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #f5f7f5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3px;
  }
  .header-logo svg { width: 30px; height: 30px; }
  .header-title {
    font-size: 16px;
    font-weight: 700;
    color: #2D5A27;
    letter-spacing: -0.5px;
  }
  .header-subtitle {
    font-size: 11px;
    color: #999;
    margin-top: 1px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-bell {
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .header-bell-dot {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 8px;
    height: 8px;
    background: #ef4444;
    border-radius: 50%;
    border: 2px solid #fff;
    display: none;
  }
  .header-bell-dot.show { display: block; }
  .header-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #E1F5EE;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: #0F6E56;
  }
  .client-name { display: none; }
  .logout-btn {
    padding: 7px 14px;
    background: none;
    border: 1.5px solid #e5e7e5;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    color: #666;
    transition: all 0.2s;
  }
  .logout-btn:hover { border-color: #b91c1c; color: #b91c1c; }

  /* Notification dropdown */
  .noti-dropdown {
    display: none;
    position: absolute;
    top: 44px;
    right: 0;
    width: 320px;
    max-height: 380px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    border: 1px solid #e5e7e5;
    z-index: 200;
    overflow: hidden;
  }
  .noti-dropdown.open { display: block; }
  .noti-dropdown-header {
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .noti-dropdown-header .noti-count {
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: #d97706;
    border-radius: 10px;
    padding: 2px 8px;
  }
  .noti-dropdown-list {
    overflow-y: auto;
    max-height: 320px;
  }
  .noti-item {
    padding: 12px 16px;
    border-bottom: 1px solid #f5f5f5;
    cursor: pointer;
    transition: background 0.15s;
  }
  .noti-item:hover { background: #f9faf9; }
  .noti-item:last-child { border-bottom: none; }
  .noti-item-title {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .noti-item-meta {
    font-size: 11px;
    color: #999;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .noti-item-badge {
    font-size: 10px;
    font-weight: 600;
    color: #92400e;
    background: #fef3c7;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .noti-empty {
    padding: 32px 16px;
    text-align: center;
    font-size: 13px;
    color: #999;
  }

  /* Main container */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .stat-card {
    flex: 1;
    min-width: 120px;
    background: #fff;
    border-radius: 12px;
    padding: 16px 20px;
    border: 1px solid #e5e7e5;
  }
  .stat-card .label {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
  }
  .stat-card .value {
    font-size: 24px;
    font-weight: 700;
  }
  .stat-card.pending .value { color: #d97706; }
  .stat-card.approved .value { color: #2D5A27; }
  .stat-card.rejected .value { color: #b91c1c; }

  /* Filter tabs */
  .filter-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-tab {
    padding: 8px 18px;
    border-radius: 20px;
    border: 1.5px solid #ddd;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    color: #555;
  }
  .filter-tab:hover { border-color: #2D5A27; color: #2D5A27; }
  .filter-tab.active {
    background: #2D5A27;
    color: #fff;
    border-color: #2D5A27;
  }
  .filter-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 4px;
    background: #e5e7e5;
    color: #555;
  }
  .filter-tab.active .filter-badge {
    background: rgba(255,255,255,0.25);
    color: #fff;
  }
  .badge-warning { background: #fef3cd; color: #856404; }
  .badge-success { background: #d4edda; color: #155724; }
  .badge-danger { background: #f8d7da; color: #721c24; }
  .filter-tab.active .badge-warning,
  .filter-tab.active .badge-success,
  .filter-tab.active .badge-danger {
    background: rgba(255,255,255,0.25);
    color: #fff;
  }

  /* Date divider */
  .date-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0 10px;
    font-size: 13px;
    font-weight: 500;
    color: #64748b;
  }
  .date-divider:first-child { margin-top: 0; }
  .date-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e5e7e5;
  }
  .date-count {
    font-size: 11px;
    font-weight: 400;
    background: #f1f5f1;
    padding: 2px 8px;
    border-radius: 10px;
    color: #64748b;
  }

  /* Content cards */
  .content-list { display: flex; flex-direction: column; gap: 16px; }
  .content-card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e5e7e5;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .content-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .card-main {
    padding: 20px 24px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-info { flex: 1; min-width: 200px; }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    color: #888;
  }
  .card-meta span {
    background: #f5f5f5;
    padding: 3px 10px;
    border-radius: 6px;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* Status badge */
  .badge {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-approved { background: #dcfce7; color: #166534; }
  .badge-rejected { background: #fee2e2; color: #991b1b; }
  .badge-republish { background: #dbeafe; color: #1e40af; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; margin-left: 8px; }
  .republish-note { background: #f0f9ff; color: #1e40af; font-size: 12px; padding: 8px 16px 8px 24px; border-top: 1px solid #e0f2fe; }
  /* Buttons */
  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-preview {
    background: #f0f0f0;
    color: #333;
  }
  .btn-preview:hover { background: #e0e0e0; }
  .btn-approve {
    background: #2D5A27;
    color: #fff;
  }
  .btn-approve:hover { background: #224a1e; }
  .btn-reject {
    background: #fff;
    color: #b91c1c;
    border: 1.5px solid #fca5a5;
  }
  .btn-reject:hover { background: #fef2f2; }
  .btn-edit {
    background: #fff;
    color: #2563eb;
    border: 1.5px solid #93c5fd;
  }
  .btn-edit:hover { background: #eff6ff; }

  /* 수정 모달 */
  .edit-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    overflow-y: auto;
  }
  .edit-overlay.active { display: flex; }
  .edit-modal {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 800px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .edit-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 1px solid #e5e7eb;
  }
  .edit-modal-header h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }
  .edit-modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #6b7280;
    padding: 4px;
  }
  .edit-modal-body {
    padding: 24px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
  }
  .edit-field {
    margin-bottom: 20px;
  }
  .edit-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  .edit-field input,
  .edit-field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
  }
  .edit-field input:focus,
  .edit-field textarea:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .edit-field textarea {
    min-height: 300px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  .edit-field .field-hint {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 4px;
  }
  .edit-modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid #e5e7eb;
  }
  .edit-modal-footer .btn-save {
    background: #2563eb;
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-weight: 600;
  }
  .edit-modal-footer .btn-save:hover { background: #1d4ed8; }
  .edit-modal-footer .btn-cancel {
    background: #f3f4f6;
    color: #374151;
    padding: 10px 24px;
    border-radius: 8px;
  }
  .edit-wp-sync {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #eff6ff;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 13px;
    color: #1e40af;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-loading {
    position: relative;
    color: transparent !important;
    pointer-events: none;
  }
  .btn-loading::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: btnSpin 0.6s linear infinite;
  }
  .btn-reject.btn-loading::after {
    border-color: rgba(185,28,28,0.3);
    border-top-color: #b91c1c;
  }
  @keyframes btnSpin { to { transform: rotate(360deg); } }

  /* 미리보기 풀스크린 모달 */
  .preview-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1100;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
    overflow-y: auto;
  }
  .preview-overlay.active { display: flex; }
  .preview-modal {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 48px);
  }
  .preview-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #e5e7eb;
    flex-shrink: 0;
  }
  .preview-modal-header h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: calc(100% - 80px);
  }
  .preview-modal-header .preview-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 4px;
    font-size: 12px;
    color: #9ca3af;
  }
  .preview-modal-close {
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    color: #6b7280;
    padding: 4px 8px;
    line-height: 1;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .preview-modal-close:hover { background: #f3f4f6; color: #1f2937; }
  .preview-modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }
  .preview-modal-body iframe {
    width: 100%;
    border: none;
    min-height: 500px;
    display: block;
  }

  /* Toast */
  .toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    padding: 14px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    animation: slideIn 0.3s ease;
    max-width: 360px;
  }
  .toast.success { background: #2D5A27; }
  .toast.error { background: #b91c1c; }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* Confirm modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    max-width: 400px;
    width: 90%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  .modal-box h3 {
    font-size: 17px;
    margin-bottom: 10px;
  }
  .modal-box p {
    font-size: 14px;
    color: #666;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .modal-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .modal-btns .btn { min-width: 100px; padding: 10px 20px; }
  .btn-cancel {
    background: #f0f0f0;
    color: #333;
  }

  /* Search bar */
  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 180px;
    padding: 9px 14px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: #2D5A27; }
  .sort-select {
    padding: 9px 14px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    font-size: 13px;
    background: #fff;
    cursor: pointer;
    outline: none;
  }
  .sort-select:focus { border-color: #2D5A27; }

  /* Pagination */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 20px;
    padding-top: 16px;
  }
  .pagination button {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1.5px solid #ddd;
    background: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    transition: all 0.2s;
  }
  .pagination button:hover { background: #f5f5f5; }
  .pagination button.active {
    background: #2D5A27;
    color: #fff;
    border-color: #2D5A27;
  }
  .pagination button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .pagination .page-info {
    font-size: 13px;
    color: #999;
    margin: 0 8px;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    font-size: 15px;
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
  }
  .empty-state p { font-size: 15px; }

  /* View tabs */
  .view-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    border-bottom: 1.5px solid #e5e7e5;
  }
  .view-tab {
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
    color: #888;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    transition: all 0.2s;
  }
  .view-tab:hover { color: #2D5A27; }
  .view-tab.active {
    color: #2D5A27;
    border-bottom-color: #2D5A27;
  }

  /* Calendar */
  .calendar-section { display: none; }
  .calendar-section.active { display: block; }
  .list-section { display: none; }
  .list-section.active { display: block; }

  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .cal-nav {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .cal-nav-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1.5px solid #ddd;
    background: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    transition: all 0.2s;
  }
  .cal-nav-btn:hover { background: #f5f5f5; border-color: #2D5A27; color: #2D5A27; }
  .cal-month-label {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    min-width: 120px;
    text-align: center;
  }
  .cal-today-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1.5px solid #ddd;
    background: #fff;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: #555;
    transition: all 0.2s;
  }
  .cal-today-btn:hover { border-color: #2D5A27; color: #2D5A27; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: #e5e7e5;
    border: 1px solid #e5e7e5;
    border-radius: 12px;
    overflow: hidden;
  }
  .cal-dow {
    background: #f5f7f5;
    padding: 8px 4px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #888;
  }
  .cal-cell {
    background: #fff;
    min-height: 110px;
    padding: 5px;
    vertical-align: top;
  }
  .cal-cell.other-month {

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalMessage"></p>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn" id="modalConfirmBtn" onclick="confirmAction()">확인</button>
    </div>
  </div>
</div>

<script>
const token = sessionStorage.getItem('token');
if (!token) {
  window.location.href = '/client/login';
}

let allContents = [];
let currentFilter = 'all';
let currentClientPage = 1;
let clientSearchTimer = null;
let pendingAction = null;

// Display client name
const clientName = sessionStorage.getItem('clientName');
if (clientName) {
  document.getElementById('clientName').textContent = clientName;
}

// Auth headers
function authHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + token
  };
}

// Toast
function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'opacity 0.3s';
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// Modal
function openModal(title, message, confirmLabel, confirmClass, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMessage').textContent = message;
  const btn = document.getElementById('modalConfirmBtn');
  btn.textContent = confirmLabel;
  btn.className = 'btn ' + confirmClass;
  pendingAction = onConfirm;
  document.getElementById('confirmModal').classList.add('open');
}
function closeModal() {
  document.getElementById('confirmModal').classList.remove('open');
  pendingAction = null;
}
async function confirmAction() {
  if (!pendingAction) return;
  var btn = document.getElementById('modalConfirmBtn');
  btn.classList.add('btn-loading');
  btn.disabled = true;
  try {
    await pendingAction();
  } finally {
    btn.classList.remove('btn-loading');
    btn.disabled = false;
    closeModal();
  }
}

// Logout
// ─── Notification Dropdown ───
function toggleNotiDropdown(e) {
  e.stopPropagation();
  var dd = document.getElementById('notiDropdown');
  var isOpen = dd.classList.contains('open');
  dd.classList.toggle('open');
  if (!isOpen) loadNotiItems();
}

document.addEventListener('click', function(e) {
  var dd = document.getElementById('notiDropdown');
  if (dd && !dd.contains(e.target)) dd.classList.remove('open');
});

async function loadNotiItems() {
  var list = document.getElementById('notiList');
  list.innerHTML = '<div class="noti-empty">불러오는 중...</div>';
  try {
    var res = await fetch('/api/client/contents?status=pending&limit=20&sort=latest', { headers: authHeaders() });
    if (res.status === 401) { handleLogout(); return; }
    if (!res.ok) throw new Error();
    var result = await res.json();
    var items = result.data || [];
    var countEl = document.getElementById('notiCount');
    countEl.textContent = items.length;
    if (items.length === 0) {
      list.innerHTML = '<div class="noti-empty">대기 중인 콘텐츠가 없습니다</div>';
      return;
    }
    list.innerHTML = items.map(function(item) {
      var date = item.created_at ? new Date(item.created_at) : null;
      var dateStr = date ? (date.getMonth()+1) + '/' + date.getDate() : '';
      var topic = item.topic || '';
      return '<div class="noti-item" onclick="goToPendingList()">' +
        '<div class="noti-item-title">' + (item.title || '제목 없음') + '</div>' +
        '<div class="noti-item-meta">' +
          '<span class="noti-item-badge">대기중</span>' +
          (topic ? '<span>' + topic + '</span>' : '') +
          (dateStr ? '<span>' + dateStr + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  } catch(err) {
    list.innerHTML = '<div class="noti-empty">알림을 불러오지 못했습니다</div>';
  }
}

function goToPendingList() {
  document.getElementById('notiDropdown').classList.remove('open');
  // Switch to list view
  var listBtn = document.querySelector('.view-tab:nth-child(2)');
  if (listBtn) switchView('list', listBtn);
  // Set filter to pending
  var pendingBtn = document.querySelector('.filter-tab[data-filter="pending"]');
  if (pendingBtn) setFilter('pending', pendingBtn);
}

function handleLogout() {
  sessionStorage.removeItem('token');
  sessionStorage.removeItem('clientName');
  window.location.href = '/client/login';
}

// Search debounce
function debounceClientSearch() {
  clearTimeout(clientSearchTimer);
  clientSearchTimer = setTimeout(() => { currentClientPage = 1; loadContents(); }, 400);
}

// Filter
function setFilter(filter, el) {
  currentFilter = filter;
  currentClientPage = 1;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadContents();
}

// Format date
function toKST(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  return new Date(d.getTime() + 9 * 60 * 60 * 1000);
}

function formatDate(dateStr) {
  const k = toKST(dateStr);
  if (!k) return '-';
  const y = k.getUTCFullYear();
  const m = String(k.getUTCMonth()+1).padStart(2,'0');
  const day = String(k.getUTCDate()).padStart(2,'0');
  return y + '.' + m + '.' + day;
}

function formatDateTime(dateStr) {
  const k = toKST(dateStr);
  if (!k) return '';
  const y = k.getUTCFullYear();
  const m = String(k.getUTCMonth()+1).padStart(2,'0');
  const day = String(k.getUTCDate()).padStart(2,'0');
  const h = String(k.getUTCHours()).padStart(2,'0');
  const min = String(k.getUTCMinutes()).padStart(2,'0');
  return y + '.' + m + '.' + day + ' ' + h + ':' + min;
}

// ─── 광고주 수정 diff: 블록 단위 비교 + 텍스트 블록은 단어 단위 하이라이트 ───
function splitHtmlBlocks(html) {
  var parts = html.split(/(?=<(?:p|h[1-6]|figure|div|ul|ol|blockquote|table|hr)\b)/i);
  var out = [];
  for (var i = 0; i < parts.length; i++) {
    var t = parts[i];
    if (t && t.replace(/\s/g, '') !== '') out.push(t);
  }
  return out;
}

function lcsTable(a, b) {
  var n = a.length, m = b.length;
  var dp = [];
  for (var i = 0; i <= n; i++) { dp.push(new Array(m + 1).fill(0)); }
  for (var i = 1; i <= n; i++) {
    for (var j = 1; j <= m; j++) {
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp;
}

function diffSeq(a, b) {
  // 토큰 수가 너무 많으면 diff 생략 (성능 보호)
  if (a.length * b.length > 1500000) return null;
  var dp = lcsTable(a, b);
  var ops = [];
  var i = a.length, j = b.length;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i-1] === b[j-1]) { ops.unshift({ t: '=', v: a[i-1] }); i--; j--; }
    else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) { ops.unshift({ t: '+', v: b[j-1] }); j--; }
    else { ops.unshift({ t: '-', v: a[i-1] }); i--; }
  }
  return ops;
}

function wordDiffHtml(beforeHtml, afterHtml) {
  var tokenize = function(s) { return s.match(/<[^>]+>|[^<\s]+|\s+/g) || []; };
  var ops = diffSeq(tokenize(beforeHtml), tokenize(afterHtml));
  if (!ops) return null;
  var out = '';
  for (var k = 0; k < ops.length; k++) {
    var o = ops[k];
    var isTag = /^</.test(o.v);
    if (o.t === '=' || isTag) {
      if (o.t !== '-') out += o.v;
    } else if (o.t === '+') {
      out += '<ins style="background:#def7dc;color:#1e6b1e;text-decoration:none;padding:1px 2px;border-radius:3px;">' + o.v + '</ins>';
    } else {
      out += '<del style="background:#fde8e8;color:#9b1c1c;padding:1px 2px;border-radius:3px;">' + o.v + '</del>';
    }
  }
  return out;
}

function diffBlockLabel(text, color) {
  return '<div style="font-size:11px;color:' + color + ';margin:14px 0 2px;">' + text + '</div>';
}

function buildEditDiffHtml(beforeHtml, afterHtml) {
  var A = splitHtmlBlocks(beforeHtml);
  var B = splitHtmlBlocks(afterHtml);
  var ops = diffSeq(A, B);
  if (!ops) return afterHtml; // 너무 큰 콘텐츠는 수정 후 화면으로 대체

  var out = '';
  var k = 0;
  while (k < ops.length) {
    var o = ops[k];
    if (o.t === '=') { out += o.v; k++; continue; }

    // 연속된 삭제/추가 묶음 수집
    var dels = [], inss = [];
    while (k < ops.length && ops[k].t !== '=') {
      if (ops[k].t === '-') dels.push(ops[k].v); else inss.push(ops[k].v);
      k++;
    }

    // 1:1 텍스트 블록 교체면 단어 단위 diff
    if (dels.length === 1 && inss.length === 1 && !/<img\b/i.test(dels[0]) && !/<img\b/i.test(inss[0])) {
      var wd = wordDiffHtml(dels[0], inss[0]);
      if (wd !== null) { out += wd; continue; }
    }

    for (var d = 0; d < dels.length; d++) {
      if (/<img\b/i.test(dels[d])) {
        out += diffBlockLabel('교체/삭제 전 이미지', '#9b1c1c') +
          '<div style="border:2px solid #f5b5b5;border-radius:8px;padding:6px;">' + dels[d] + '</div>';
      } else {
        out += '<div style="background:#fde8e8;border-radius:8px;padding:4px 10px;color:#9b1c1c;text-decoration:line-through;">' + dels[d] + '</div>';
      }
    }
    for (var s = 0; s < inss.length; s++) {
      if (/<img\b/i.test(inss[s])) {
        out += diffBlockLabel('교체/추가 후 이미지', '#1e6b1e') +
          '<div style="border:2px solid #a7d9a0;border-radius:8px;padding:6px;">' + inss[s] + '</div>';
      } else {
        out += '<div style="background:#def7dc;border-radius:8px;padding:4px 10px;">' + inss[s] + '</div>';
      }
    }
  }
  return out;
}

function renderPreviewIframe(cleanHtml) {

// Render
function getDateLabel(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  var today = new Date(); today.setHours(0,0,0,0);
  var target = new Date(d); target.setHours(0,0,0,0);
  var diff = Math.round((today - target) / 86400000);
  var days = ['일','월','화','수','목','금','토'];
  var label = (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + days[d.getDay()] + ')';
  if (diff === 0) label += ' · 오늘';
  else if (diff === 1) label += ' · 어제';
  return label;
}

function getDateKey(dateStr) {
  if (!dateStr) return 'unknown';
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return 'unknown';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function renderContents() {
  const list = document.getElementById('contentList');

  if (allContents.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>' +
      (currentFilter === 'all' ? '등록된 콘텐츠가 없습니다.' : statusLabel(currentFilter) + ' 상태의 콘텐츠가 없습니다.') +
      '</p></div>';
    return;
  }

  // Group by date
  var grouped = {};
  var dateOrder = [];
  allContents.forEach(function(c) {
    var raw = c.createdAt || c.created_at || c.date || '';
    var key = getDateKey(raw);
    if (!grouped[key]) { grouped[key] = { label: getDateLabel(raw), items: [] }; dateOrder.push(key); }
    grouped[key].items.push(c);
  });

  var html = '';
  dateOrder.forEach(function(key) {
    var group = grouped[key];
    html += '<div class="date-divider">' + group.label + ' <span class="date-count">' + group.items.length + '건</span></div>';
    group.items.forEach(function(c) {
      var id = c.id || c._id;
      var title = c.title || '제목 없음';
      var topic = c.topic_name || c.topic || c.diseaseName || c.disease_name || '';
      var contentType = c.content_type_name || c.contentType || c.content_type || c.type || '';
      var created = formatDate(c.createdAt || c.created_at || c.date);
      var status = c.status || 'pending';
      var htmlContent = c.htmlContent || c.html_content || c.content || '';
      var isPending = status === 'pending';

      var republishedFrom = c.republished_from || null;
      var republishNote = '';
      if (republishedFrom) {
        var rejDate = republishedFrom.rejected_at ? formatDateTime(republishedFrom.rejected_at) : '';
        republishNote = '<div class="republish-note">' + rejDate + ' "' + escapeHtml(republishedFrom.title || '') + '" 콘텐츠에 대한 재발행건입니다</div>';
      }

      html += '<div class="content-card">' +
        '<div class="card-main">' +
          '<div class="card-info">' +
            '<div class="card-title">' + (c.is_test ? '<span style="display:inline-block;background:#94a3b8;color:#fff;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:middle">테스트</span>' : '') + escapeHtml(title) + (republishedFrom ? ' <span class="badge-republish">재발행</span>' : '') + (Array.isArray(c.edit_history) && c.edit_history.length > 0 ? ' <span style="display:inline-block;background:#fef3c7;color:#92400e;font-size:11px;padding:1px 6px;border-radius:4px;vertical-align:middle">수정됨</span>' : '') + '</div>' +
            '<div class="card-meta">' +
              '<span>' + created + '</span>' +
              (topic ? '<span>' + escapeHtml(topic) + '</span>' : '') +
              (contentType ? '<span>' + escapeHtml(contentType) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="card-actions">' +
            '<span class="badge ' + statusBadgeClass(status) + '">' + statusLabel(status) + '</span>' +
            '<button class="btn btn-preview" onclick="openPreviewModal(\'' + id + '\')">미리보기</button>' +
            (status !== 'rejected' ? '<button class="btn btn-edit" onclick="openEditModal(\'' + id + '\')">수정</button>' : '') +
            (isPending ? '<button class="btn btn-approve" onclick="approveContent(\'' + id + '\', \'' + escapeAttr(title) + '\')">승인</button>' : '') +
            (isPending ? '<button class="btn btn-reject" onclick="rejectContent(\'' + id + '\', \'' + escapeAttr(title) + '\')">반려</button>' : '') +
          '</div>' +
        '</div>' +
        republishNote +
      '</div>';
    });
  });
  list.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Update stats from counts

// Pagination renderer
function renderClientPagination(result) {
  const container = document.getElementById('clientPagination');
  if (!result || result.totalPages <= 1) { container.innerHTML = ''; return; }

  const { page, totalPages, total } = result;
  let html = '';
  html += '<button ' + (page <= 1 ? 'disabled' : '') + ' onclick="goClientPage(' + (page - 1) + ')">&#8249;</button>';

  const start = Math.max(1, page - 2);
  const end = Math.min(totalPages, page + 2);

  if (start > 1) { html += '<button onclick="goClientPage(1)">1</button>'; if (start > 2) html += '<span class="page-info">...</span>'; }
  for (let i = start; i <= end; i++) {
    html += '<button class="' + (i === page ? 'active' : '') + '" onclick="goClientPage(' + i + ')">' + i + '</button>';
  }
  if (end < totalPages) { if (end < totalPages - 1) html += '<span class="page-info">...</span>'; html += '<button onclick="goClientPage(' + totalPages + ')">' + totalPages + '</button>'; }

  html += '<button ' + (page >= totalPages ? 'disabled' : '') + ' onclick="goClientPage(' + (page + 1) + ')">&#8250;</button>';
  html += '<span class="page-info">' + total + '건</span>';
  container.innerHTML = html;
}

function goClientPage(page) {
  currentClientPage = page;
  loadContents();
}

// Load contents (paginated)
async function loadContents() {
  const search = document.getElementById('clientSearch').value;
  const sort = document.getElementById('clientSort').value;
  const status = currentFilter === 'all' ? '' : currentFilter;

  const params = new URLSearchParams({
    page: currentClientPage, limit: 10,
    search, status, sort,
  });

  try {
    const res = await fetch('/api/client/contents?' + params, {
      headers: authHeaders()
    });
    if (res.status === 401) { handleLogout(); return; }
    if (!res.ok) throw new Error();
    const result = await res.json();
    allContents = result.data || [];
    updateStats(result.counts);
    renderContents();
    renderClientPagination(result);
  } catch {
    document.getElementById('contentList').innerHTML =
      '<div class="empty-state"><p>콘텐츠를 불러오지 못했습니다. 새로고침 해주세요.</p></div>';
  }
}

// ─── Calendar Logic ───
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth(); // 0-indexed
let calData = [];

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  loadCalendar();
}

function goToday() {
  calYear = new Date().getFullYear();
  calMonth = new Date().getMonth();
  loadCalendar();
}

async function loadCalendar() {
  document.getElementById('calMonthLabel').textContent = calYear + '년 ' + (calMonth + 1) + '월';

  try {
    const res = await fetch('/api/client/contents?page=1&limit=200&search=&status=&sort=latest', {
      headers: authHeaders()
    });
    if (res.status === 401) { handleLogout(); return; }
    if (!res.ok) throw new Error();
    const result = await res.json();
    calData = result.data || [];
    renderCalendar();
  } catch {
    document.getElementById('calGrid').innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#aaa;font-size:14px">캘린더를 불러오지 못했습니다.</div>';
  }
}

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  const dows = ['일','월','화','수','목','금','토'];

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevMonthDays = new Date(calYear, calMonth, 0).getDate();

  const today = new Date();
  const isCurrentMonth = today.getFullYear() === calYear && today.getMonth() === calMonth;
  const todayDate = today.getDate();

  // Group contents by date
  const byDate = {};
  calData.forEach(c => {
    const d = new Date(c.created_at || c.createdAt || c.date);
    if (isNaN(d.getTime())) return;
    if (d.getFullYear() === calYear && d.getMonth() === calMonth) {
      const day = d.getDate();
      if (!byDate[day]) byDate[day] = [];
      byDate[day].push(c);
    }
  });

  let html = '';
  // Day of week headers
  dows.forEach(d => {
    html += '<div class="cal-dow">' + d + '</div>';
  });

  // Previous month fill
  for (let i = firstDay - 1; i >= 0; i--) {
    const d = prevMonthDays - i;
    html += '<div class="cal-cell other-month"><div class="cal-date">' + d + '</div></div>';
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = isCurrentMonth && d === todayDate;
    html += '<div class="cal-cell' + (isToday ? ' today' : '') + '">';
    html += '<div class="cal-date">' + d + '</div>';

    const items = byDate[d] || [];
    const maxShow = 5;
    items.slice(0, maxShow).forEach(c => {
      const st = c.status || 'pending';
      const stClass = (st === 'approved' || st === 'published') ? 'st-approved' : (st === 'rejected' ? 'st-rejected' : 'st-pending');
      const title = (c.title || '').length > 12 ? (c.title || '').substring(0, 12) + '..' : (c.title || '');
      html += '<div class="cal-item ' + stClass + '"><div class="cal-item-dot"></div>' + escapeHtml(title) + '</div>';
    });
    if (items.length > maxShow) {
      html += '<div class="cal-more">+' + (items.length - maxShow) + '건 더</div>';
    }

    html += '</div>';
  }

  // Next month fill
  const totalCells = firstDay + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remaining; d++) {
    html += '<div class="cal-cell other-month"><div class="cal-date">' + d + '</div></div>';
  }

    grid.innerHTML = html;
}

// Init
loadCalendar();
loadContents();

// 다음 발행 예정 시간 + 기간 배너 로드
fetch('/api/client/status', { headers: authHeaders() }).then(r=>r.json()).then(d=>{
  var el=document.getElementById('clientNextPublish');
  if(d.content && d.content.published>=d.content.totalTarget && d.content.totalTarget>0){
    el.textContent='모든 콘텐츠 발행 완료';
    el.style.color='#16a34a';
  } else if(d.nextPublishTime){
    el.textContent=d.nextPublishTime.date+' '+d.nextPublishTime.time;
  } else if(d.publishPeriod && d.publishPeriod.status==='expired'){
    el.textContent='발행 기간 종료';
    el.style.color='#94a3b8';
  } else if(d.publishPeriod && d.publishPeriod.status==='waiting'){
    el.textContent=d.publishPeriod.startDate+' 시작 예정';
    el.style.color='#f59e0b';
  } else {
    el.textContent='-';
  }
  renderClientPeriodBanner(d.publishPeriod);
}).catch(()=>{});

function renderClientPeriodBanner(period){
  const el=document.getElementById('clientPeriodBanner');
  if(!period){el.style.display='none';return;}
  el.style.display='flex';
  const sd=period.startDate||'-',ed=period.endDate||'-';
  let dotColor,statusText,daysText,bgColor,borderColor;
  if(period.status==='waiting'){
    dotColor='#94a3b8';statusText='발행 대기 중';bgColor='#f8fafc';borderColor='#e2e8f0';
    daysText='D-'+period.daysLeft+' (시작 전)';
  }else if(period.status==='expired'){
    dotColor='#dc2626';statusText='계약 기간이 종료되었습니다';bgColor='#fef2f2';borderColor='#fecaca';
    daysText='만료';
  }else if(period.status==='dday'){
    dotColor='#ef4444';statusText='오늘 종료';bgColor='#fef2f2';borderColor='#fecaca';
    daysText='D-Day';
  }else if(period.status==='expiring'){
    dotColor='#f59e0b';statusText='종료 임박';bgColor='#fffbeb';borderColor='#fde68a';
    daysText='D-'+period.daysLeft;
  }else{
    dotColor='#10b981';statusText='정상 운영 중';bgColor='#f0fdf4';borderColor='#bbf7d0';
    daysText=period.daysLeft!==null?(period.daysLeft===0?'D-Day':'D-'+period.daysLeft):'';
  }
  el.style.background=bgColor;el.style.borderColor=borderColor;
  let contactBtn='';
  if(period.status==='expired'||period.status==='dday'||period.status==='expiring'){
    contactBtn='<button onclick="alert(\'연장 문의: 관리자에게 연락해주세요.\')" style="margin-top:6px;padding:6px 14px;background:'+dotColor+';color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">연장 문의</button>';
  }
  el.innerHTML='<div style="display:flex;align-items:center;gap:12px">'+
    '<div style="width:8px;height:8px;border-radius:50%;background:'+dotColor+'"></div>'+
    '<div><div style="font-size:12px;color:#64748b">발행 기간</div>'+
    '<div style="font-size:15px;font-weight:600">'+sd.replace(/-/g,'.')+' ~ '+ed.replace(/-/g,'.')+'</div></div></div>'+
    '<div style="text-align:right"><div style="font-size:22px;font-weight:600;color:'+dotColor+'">'+daysText+'</div>'+
    '<div style="font-size:12px;color:#64748b">'+statusText+'</div>'+contactBtn+'</div>';
}
</script>

<!-- 수정 모달 -->
<div class="edit-overlay" id="editOverlay">
  <div class="edit-modal">
    <div class="edit-modal-header">
      <h3>콘텐츠 수정</h3>
      <button class="edit-modal-close" onclick="closeEditModal()">&times;</button>
    </div>
    <div class="edit-modal-body">
      <div class="edit-wp-sync" id="editWpSync" style="display:none">
        WordPress에 발행된 글입니다. 저장 시 WordPress 게시글도 자동 업데이트됩니다.
      </div>
      <input type="hidden" id="editItemId" />
      <div class="edit-field">
        <label>제목</label>
        <input type="text" id="editTitle" placeholder="제목을 입력하세요" />
      </div>
      <div class="edit-field">
        <label>메타 설명 (SEO)</label>
        <input type="text" id="editMetaDesc" placeholder="검색 결과에 표시되는 설명" />
        <div class="field-hint">검색엔진 결과 페이지에 표시됩니다. 150자 이내 권장.</div>
      </div>
      <div class="edit-field">
        <label>요약 (Excerpt)</label>
        <textarea id="editExcerpt" style="min-height:60px"></textarea>
      </div>
      <div class="edit-field">
        <label>태그 (쉼표로 구분)</label>
        <input type="text" id="editTags" placeholder="태그1, 태그2, 태그3" />
      </div>
      <div class="edit-field">
        <label>본문 (HTML)</label>
        <textarea id="editContent" placeholder="HTML 본문을 수정하세요"></textarea>
        <div class="field-hint">HTML 태그가 포함된 본문입니다. 구조를 변경할 경우 GEO 최적화에 영향을 줄 수 있습니다.</div>
      </div>
    </div>
    <div class="edit-modal-footer">
      <button class="btn btn-cancel" onclick="closeEditModal()">취소</button>
      <button class="btn btn-save" id="editSaveBtn" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<script>
// ─── 수정 모달 로직 ───
var editingItem = null;
var hiddenScripts = ''; // 수정 시 숨긴 <script> 태그 임시 저장

// 한 줄로 압축된 HTML을 블록 태그마다 줄바꿈해서 읽기 쉽게 정렬
// (태그 사이 줄바꿈은 HTML 렌더링에 영향 없음 — 저장해도 안전)
function prettyPrintHtml(html) {
  if (!html) return '';
  var blockClose = /<\/(p|h1|h2|h3|h4|h5|h6|li|ul|ol|div|section|article|table|tr|thead|tbody|blockquote|figure|figcaption)>/gi;
  var blockSelfOrOpen = /(<(br|hr)\s*\/?>|<(ul|ol|table|thead|tbody|tr|section|article|figure|blockquote)[^>]*>)/gi;
  return html
    .replace(/>\s+</g, '><')        // 먼저 태그 사이 기존 공백/줄바꿈 제거 (정규화)
    .replace(blockClose, function(m) { return m + '\n'; })
    .replace(blockSelfOrOpen, function(m) { return '\n' + m; })
    .replace(/\n{2,}/g, '\n')      // 연속 줄바꿈 → 1개 (WP wpautop의 빈줄→<p> 변환 방지)
    .replace(/^\s+|\s+$/g, '');    // 앞뒤 공백 제거
}

function openEditModal(itemId) {
  var item = allContents.find(function(c) { return (c.id || c._id) === itemId; });
  if (!item) { alert('콘텐츠를 찾을 수 없습니다.'); return; }
  editingItem = item;

  document.getElementById('editItemId').value = itemId;
  document.getElementById('editTitle').value = item.title || '';
  document.getElementById('editMetaDesc').value = item.meta_description || '';
  document.getElementById('editExcerpt').value = item.excerpt || '';
  document.getElementById('editTags').value = Array.isArray(item.tags) ? item.tags.join(', ') : (item.tags || '');

  // 본문에서 <script> 태그 분리 (JSON-LD 등 광고주에게 불필요한 코드 숨김)
  var rawContent = item.content || item.htmlContent || item.html_content || '';
  hiddenScripts = '';
  var cleanContent = rawContent.replace(/<script[\s\S]*?<\/script>/gi, function(match) {
    hiddenScripts += '\n' + match;
    return '';
  }).trim();
  document.getElementById('editContent').value = prettyPrintHtml(cleanContent);

  // WP 발행 여부 표시
  var wpSync = document.getElementById('editWpSync');
  wpSync.style.display = item.wp_post_id ? 'flex' : 'none';

  document.getElementById('editOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeEditModal() {
  document.getElementById('editOverlay').classList.remove('active');
  document.body.style.overflow = '';
  editingItem = null;
  hiddenScripts = '';
}

async function saveEdit() {
  var itemId = document.getElementById('editItemId').value;
  var title = document.getElementById('editTitle').value.trim();
  var content = document.getElementById('editContent').value.trim();
  // 숨겨둔 <script> 태그 복원 (JSON-LD 스키마 등)
  if (hiddenScripts) content = content + hiddenScripts;
  var metaDesc = document.getElementById('editMetaDesc').value.trim();
  var excerpt = document.getElementById('editExcerpt').value.trim();
  var tagsRaw = document.getElementById('editTags').value.trim();

  if (!title) { alert('제목을 입력해주세요.'); return; }
  if (!content) { alert('본문을 입력해주세요.'); return; }

  var tags = tagsRaw ? tagsRaw.split(',').map(function(t) { return t.trim(); }).filter(Boolean) : [];

  var saveBtn = document.getElementById('editSaveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '저장 중...';

  try {
    var resp = await fetch('/api/client/contents/' + itemId + '/edit', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + sessionStorage.getItem('token'),
      },
      body: JSON.stringify({
        title: title,
        content: content,
        meta_description: metaDesc,
        excerpt: excerpt,
        tags: tags,
      }),
    });

    var result = await resp.json();
    if (!resp.ok) throw new Error(result.error || '수정 실패');

    // 로컬 데이터 업데이트
    if (editingItem) {
      editingItem.title = title;
      editingItem.content = content;
      editingItem.html_content = content;
      editingItem.htmlContent = content;
      editingItem.meta_description = metaDesc;
      editingItem.excerpt = excerpt;
      editingItem.tags = tags;
    }

    closeEditModal();
    renderContents();
    alert(result.message || '수정이 완료되었습니다.');
  } catch (e) {
    alert('수정 실패: ' + e.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '저장';
  }
}

// ESC 키로 모달 닫기
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('previewOverlay').classList.contains('active')) {
      closePreviewModal();
    } else if (document.getElementById('editOverlay').classList.contains('active')) {
      closeEditModal();
    }
  }
});
</script>
